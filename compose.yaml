# Initial single-server deployment target: PostgreSQL + FastAPI (1 worker)
# + an optional, separate scheduler process. See docs/DEPLOYMENT.md for
# the full topology and docs/DOCKER.md for the design rationale.
#
# Usage:
#   cp .env.example .env            # fill in real values, never commit .env
#   docker compose build
#   docker compose up -d db
#   docker compose run --rm web alembic upgrade head   # explicit, not automatic
#   docker compose up -d web
#   docker compose --profile scheduler up -d scheduler # optional, opt-in

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobtriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobtriage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobtriage} -d ${POSTGRES_DB:-jobtriage}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # DEPLOY-001 (Codex master review): discrete parts, not a
      # pre-assembled DATABASE_URL string. The previous
      # `DATABASE_URL: postgresql+psycopg://user:${POSTGRES_PASSWORD}@...`
      # form interpolated the raw password INTO a URI at the shell/compose
      # layer -- any URI-reserved character in the password (`@ / : # %`)
      # then corrupted the surrounding URL's delimiter structure, causing
      # SQLAlchemy to parse the wrong host/user/password split with no
      # error at all. Passing POSTGRES_HOST/PORT/USER/PASSWORD/DB as their
      # own atomic env vars means compose never concatenates the password
      # into a URI string -- `app.core.config.Settings` builds the actual
      # DATABASE_URL from these parts via `sqlalchemy.engine.URL.create`,
      # which percent-encodes each part correctly regardless of content
      # (see that module's docstring and tests/test_config.py). `db` here
      # is the compose-network Postgres service's own hostname.
      # ALEMBIC_AUTO_UPGRADE stays false on purpose -- migrations are an
      # explicit `docker compose run` step, never automatic on boot (see
      # docs/DOCKER.md).
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-jobtriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobtriage}
      ALEMBIC_AUTO_UPGRADE: "false"
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Opt-in: only needed if AUTOMATION_SCHEDULER_ENABLED or
  # TELEGRAM_DAILY_DIGEST_ENABLED is set in .env. Must never be scaled
  # beyond one replica (see docs/DEPLOYMENT.md) -- the app's own design
  # already keeps this out of the `web` service's lifespan specifically
  # so it stays a single, independent process regardless of how `web` is
  # scaled.
  scheduler:
    build: .
    command: ["python", "-m", "app.scheduler"]
    # on-failure, not unless-stopped: `python -m app.scheduler` exits 0
    # (not an error) when both AUTOMATION_SCHEDULER_ENABLED and
    # TELEGRAM_DAILY_DIGEST_ENABLED are false -- confirmed by local
    # smoke test (docs/DOCKER.md). unless-stopped would restart-loop
    # that clean exit forever; on-failure only restarts a real crash.
    restart: on-failure
    profiles: ["scheduler"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # See the `web` service's own POSTGRES_* comment above (DEPLOY-001)
      # -- same discrete-parts rationale applies here unchanged.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-jobtriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobtriage}
      ALEMBIC_AUTO_UPGRADE: "false"

volumes:
  pgdata:
