# DEP-03: surface vulnerable/outdated dependencies as reviewable PRs (never auto-merged).
# v1.0.0 feature freeze: one grouped PR per ecosystem per month keeps the repository quiet.
# Security updates are separate from this schedule and are not affected by it.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
