name: CI

on:
  push:
  pull_request:

# OPS-05: least privilege for the default token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # the full suite takes ~45-55 min on a loaded machine; coverage adds overhead
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # TEST-06: a per-test timeout kills a hung (thread/async) test instead of holding the job;
      # coverage is REPORTED (no threshold yet: measured 96 % on 2026-11-06).
      - run: pytest -q --timeout=600 --cov=app --cov-report=term --cov-report=xml:coverage.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # Real-PostgreSQL job (details and the phase rule: docs/CI.md). The schema comes from the real
  # Alembic chain on an empty database -- never Base.metadata.create_all -- and every module in
  # tests/integration is discovered (no hand-maintained file list). The zero-skip gate makes a
  # green job mean that the PostgreSQL tests really ran.
  scheduler-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler_test
          POSTGRES_PASSWORD: scheduler_test
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -c constraints.txt -e ".[dev,postgres]"
      # The expected head is read from the script tree (exactly one head), never hard-coded.
      - name: Alembic upgrade head against CI PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          python -m alembic heads | tee /tmp/alembic_heads.txt
          test "$(grep -c '(head)' /tmp/alembic_heads.txt)" -eq 1
          head_id="$(awk '/\(head\)/ {print $1}' /tmp/alembic_heads.txt)"
          python -m alembic current | tee /tmp/alembic_current.txt
          grep -q "${head_id} (head)" /tmp/alembic_current.txt
        env:
          DATABASE_URL: postgresql+psycopg://scheduler_test:scheduler_test@localhost:5432/scheduler_test
      # Phase 1 runs at head, in any order; phase 2 runs the modules marked `pg_migration_cycle`,
      # which downgrade/upgrade the shared database and restore head in a `finally`.
      - name: PostgreSQL integration tests (zero skips)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TEST_POSTGRES_URL:-}"
          pytest -q -rs --junitxml=/tmp/postgres-at-head.xml tests/integration -m "not pg_migration_cycle"
          pytest -q -rs --junitxml=/tmp/postgres-migration-cycle.xml tests/integration -m pg_migration_cycle
          python - /tmp/postgres-at-head.xml /tmp/postgres-migration-cycle.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          failed = False
          for path in sys.argv[1:]:
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              tests = sum(int(s.get("tests", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              print(f"PostgreSQL integration {path}: {tests} tests, {skipped} skipped")
              failed = failed or tests == 0 or skipped > 0
          if failed:
              sys.exit("PostgreSQL integration gate requires zero skipped tests")
          PY
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://scheduler_test:scheduler_test@localhost:5432/scheduler_test

  # docs/DOCKER.md / docs/DEPLOYMENT.md: a lightweight build+config smoke
  # gate, not a deployment pipeline. Only proves the Dockerfile still
  # builds and compose.yaml is still syntactically/referentially valid --
  # deliberately does NOT start containers, run migrations against a
  # real database, or contact any external service (see the local
  # smoke-test evidence in docs/DOCKER.md for that deeper validation,
  # which is intentionally kept manual/local rather than duplicated in
  # CI). The throwaway .env below exists only so `docker compose config`
  # has values to resolve required ${VAR:?...} placeholders -- it holds
  # no real secret, is never used to start a container, and is removed
  # at the end of the job.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jobtriage-web:ci .
      - name: Prepare throwaway .env for compose config validation only
        run: |
          cp .env.example .env
          sed -i 's/^API_KEY=.*/API_KEY=ci-validation-only/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-validation-only/' .env
      - name: Validate compose config (both profiles)
        run: |
          docker compose config
          docker compose --profile scheduler config --services
      - name: Remove throwaway .env
        if: always()
        run: rm -f .env
