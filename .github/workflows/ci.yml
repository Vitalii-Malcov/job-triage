name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  # Stage 8B (S8B-TEST-001) + AUD-004 (Astra R3): a focused, separate job
  # -- not the full suite -- that runs ONLY the PostgreSQL-specific
  # concurrency integration tests against a real PostgreSQL server:
  # app.db.automation_schedule_repository.claim_due_schedule's CAS UPDATE
  # holding "at most one winner" on Postgres (the `test` job above
  # already covers SQLite via tests/test_automation_schedule_repository.py
  # -- see tests/integration/test_scheduler_postgres_concurrency.py), and
  # app.services.automation_gmail.prepare_gmail_response_drafts never
  # permanently skipping a message under PostgreSQL's
  # sequence-allocation-vs-commit-order semantics (see
  # tests/integration/test_gmail_watermark_postgres_concurrency.py).
  # Runs unconditionally in CI (TEST_POSTGRES_URL is always set here);
  # both test modules skip locally when that variable is unset, since
  # this project's default dev/test setup is SQLite-only.
  scheduler-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler_test
          POSTGRES_PASSWORD: scheduler_test
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,postgres]"
      # NEW-007: prove a fresh, real PostgreSQL database can be created
      # through the actual Alembic migration chain -- not through
      # Base.metadata.create_all, which would happily create tables even
      # if the real migration chain is broken. The postgres:16 service
      # container above starts empty on every job run, so this always
      # migrates from a genuinely empty database. Runs BEFORE the
      # integration tests below, which (see
      # tests/integration/test_scheduler_postgres_concurrency.py and
      # tests/integration/test_gmail_watermark_postgres_concurrency.py)
      # no longer call create_all themselves and rely entirely on this
      # step for schema creation, so a broken migration fails loudly
      # here instead of being silently papered over.
      - name: Alembic upgrade head against CI PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic current | tee /tmp/alembic_current.txt
          grep -q "b4f6a1c9e7d2 (head)" /tmp/alembic_current.txt
        env:
          DATABASE_URL: postgresql+psycopg://scheduler_test:scheduler_test@localhost:5432/scheduler_test
      - run: pytest -q tests/integration/test_scheduler_postgres_concurrency.py
          tests/integration/test_gmail_watermark_postgres_concurrency.py
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://scheduler_test:scheduler_test@localhost:5432/scheduler_test
